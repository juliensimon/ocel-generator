[project]
name = "open-agent-traces"
version = "0.2.0"
description = "Generate realistic multi-agent workflow traces with LLM-enriched content, semantic validation, and PM4Py compatibility"
readme = "README.md"
authors = [
    { name = "Julien Simon", email = "julien@julien.org" }
]
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "ocel", "ocel2", "process-mining", "agent-traces", "multi-agent",
    "synthetic-data", "observability", "anomaly-detection",
    "llm", "ai-agents", "workflow-traces", "conformance-checking",
    "pm4py", "tool-use",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing :: Traffic Generation",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.0",
    "jsonschema>=4.21",
    "faker>=24.0",
    "openai>=1.0",
    "huggingface_hub>=0.20",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
conformance = ["pm4py>=2.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.scripts]
ocelgen = "ocelgen.cli:app"

[project.urls]
Homepage = "https://github.com/juliensimon/ocel-generator"
Documentation = "https://github.com/juliensimon/ocel-generator/tree/main/docs"
Repository = "https://github.com/juliensimon/ocel-generator"
Issues = "https://github.com/juliensimon/ocel-generator/issues"
Dataset = "https://huggingface.co/datasets/juliensimon/open-agent-traces"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocelgen"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "UP042"]  # Long lines; str+Enum pattern used for Python 3.11 compat

[tool.ruff.lint.per-file-ignores]
# OCEL 2.0 schema requires camelCase field names (objectId, eventTypes, etc.)
"src/ocelgen/models/ocel.py" = ["N815"]
# Tests use mid-file imports for test organization
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

exclude = ["mlx"]

[[tool.mypy.overrides]]
module = ["faker", "pyarrow", "pyarrow.parquet", "jsonschema", "huggingface_hub", "mlx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ocelgen.enrichment.*", "ocelgen.upload.*", "ocelgen.scenarios.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require network access (deselect with '-m not network')",
]
