repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - pydantic>=2.0
          - typer>=0.9
          - types-PyYAML
        pass_filenames: false
        entry: mypy src

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast)
        entry: uv run python -m pytest tests/ -x -q --tb=short --no-cov -m "not network" -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
